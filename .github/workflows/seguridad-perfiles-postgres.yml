name: Probar seguridad perfiles PostgreSQL sin costo

on:
  pull_request:
    branches:
      - claude/figma-coproactiva-interface-9y82xq
    paths:
      - 'supabase/migrations/202610190001_bloquear_reactivacion_y_permisos_inactivos.sql'
      - 'supabase/tests/seguridad_perfiles_pg_*.sql'
      - '.github/workflows/seguridad-perfiles-postgres.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prueba-postgres-temporal:
    name: Autorización real en PostgreSQL 17 descartable
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Descargar rama de la propuesta
        uses: actions/checkout@v4
      - name: Construir el modelo previo y demostrar la falla original
        run: |
          docker exec -i "${{ job.services.postgres.id }}" \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/tests/seguridad_perfiles_pg_bootstrap.sql
      - name: Aplicar la migración real del PR al PostgreSQL TEMPORAL
        run: |
          docker exec -i "${{ job.services.postgres.id }}" \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/migrations/202610190001_bloquear_reactivacion_y_permisos_inactivos.sql
      - name: Probar usuarios activos, inactivos, clientes y service_role
        run: |
          docker exec -i "${{ job.services.postgres.id }}" \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/tests/seguridad_perfiles_pg_asserts.sql
      - name: Verificar que la reversión SQL puede aplicarse en PostgreSQL
        run: |
          docker exec -i "${{ job.services.postgres.id }}" \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/rollbacks/202610190001_bloquear_reactivacion_y_permisos_inactivos.sql
      - name: Confirmar la reversión de objetos creados
        run: |
          docker exec -i "${{ job.services.postgres.id }}" \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c \
            "DO \$\$ BEGIN IF EXISTS (SELECT 1 FROM pg_trigger WHERE tgname='trg_proteger_estado_activo_perfil' AND NOT tgisinternal) THEN RAISE EXCEPTION 'Rollback incompleto'; END IF; RAISE NOTICE 'PASS: rollback sin trigger residual'; END \$\$;"

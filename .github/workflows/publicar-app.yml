name: Publicar app CoproActiva

on:
  push:
    branches:
      - develop
  workflow_dispatch:

# El antiguo push a gh-pages con GITHUB_TOKEN no activaba la publicación.
# Solo el flujo oficial de GitHub Pages puede declarar el sitio desplegado.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publicar-app-coproactiva-v3
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Instalar dependencias
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Verificar navegación y documentos del portal cliente
        working-directory: app
        run: node --test pruebas/portal-barra-documentos.test.js pruebas/sliding-pill-navegacion.test.js pruebas/portal-navegacion-carga-pdf.test.js pruebas/informe-visor-movil.test.js
      - name: Compilar aplicación
        working-directory: app
        env:
          VITE_SUPABASE_URL: https://vnjqzpbtcccpnxngoqfx.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZuanF6cGJ0Y2NjcG54bmdvcWZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1OTAyNDcsImV4cCI6MjEwNDE2NjI0N30.7-vPmb-MhVvc-gdwJnHNVDitpG7sXVSSbClxLXl6OtQ
        run: npm run build
      - name: Preparar versión web para rutas directas
        run: |
          cp app/dist/index.html app/dist/404.html
          touch app/dist/.nojekyll
          test -s app/dist/index.html
          test -s app/dist/CNAME
      - name: Subir sitio a GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar versión web
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Comprobar dominio público
        shell: bash
        run: |
          set -euo pipefail
          for intento in $(seq 1 12); do
            if curl --fail --silent --show-error --location --connect-timeout 8 --max-time 15 \
                 -H 'Cache-Control: no-cache' \
                 "https://app.coproactiva.cl/?version=${GITHUB_SHA}" \
                 -o /tmp/coproactiva-live.html \
                 && grep -Fq 'Coproactiva App Diaria' /tmp/coproactiva-live.html; then
              bundle="$(grep -oE '/assets/index-[^"]+\.js' /tmp/coproactiva-live.html | head -n 1)"
              if test -n "$bundle" && curl --fail --silent --show-error \
                    --location --max-time 15 -o /dev/null \
                    "https://app.coproactiva.cl$bundle"; then
                echo "Sitio accesible y bundle JS servido en app.coproactiva.cl"
                exit 0
              fi
            fi
            echo "Publicación todavía no visible en el dominio: intento $intento/12"
            sleep 5
          done
          echo "::error::Pages puede haberse desplegado, pero no se verificó app.coproactiva.cl."
          exit 1

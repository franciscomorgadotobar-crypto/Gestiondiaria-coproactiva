name: Publicar app CoproActiva

on:
  push:
    branches:
      - claude/figma-coproactiva-interface-9y82xq
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-app-coproactiva-v2
  cancel-in-progress: true

jobs:
  build-y-publicacion:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependencias
        working-directory: app
        run: npm install

      - name: Compilar aplicación
        working-directory: app
        env:
          VITE_SUPABASE_URL: https://vnjqzpbtcccpnxngoqfx.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZuanF6cGJ0Y2NjcG54bmdvcWZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1OTAyNDcsImV4cCI6MjEwNDE2NjI0N30.7-vPmb-MhVvc-gdwJnHNVDitpG7sXVSSbClxLXl6OtQ
        run: npm run build

      - name: Preparar rutas de GitHub Pages
        run: |
          cp app/dist/index.html app/dist/404.html
          touch app/dist/.nojekyll
          rm -rf /tmp/coproactiva-dist
          cp -a app/dist /tmp/coproactiva-dist

      - name: Publicar en gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan publicar-app
          git rm -rf .
          cp -a /tmp/coproactiva-dist/. .
          git add -A
          git commit -m "Publicar app CoproActiva"
          git push origin HEAD:gh-pages --force

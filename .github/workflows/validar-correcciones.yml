name: Validar correcciones CoproActiva
on:
  pull_request:
    branches:
      - claude/figma-coproactiva-interface-9y82xq
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Instalar dependencias
        working-directory: app
        run: npm install
      - name: Probar criterios y compatibilidad histórica
        working-directory: app
        run: node --test pruebas/criterios.test.js
      - name: Probar reglas de SEO y propuestas editoriales
        working-directory: app
        run: node --test pruebas/seo.test.js
      - name: Probar historial SEO y clasificación sin duplicados
        working-directory: app
        run: node --test src/lib/seoEstadoOportunidades.test.mjs
      - name: Probar historial de navegación Android y PWA
        working-directory: app
        run: node --test src/lib/pestanasHistorial.test.mjs
      - name: Verificar homologación visual de módulos y PWA
        working-directory: app
        run: node --test pruebas/visual.test.js
      - name: Revisar presentación ejecutiva de SEO
        working-directory: app
        run: node --test pruebas/seo-compacto.test.js
      - name: Validar comparativas GA4, Search Console y Business Profile
        working-directory: app
        run: node --test pruebas/seo-comparativas.test.js
      - name: Verificar nombres de mejoras SEO
        working-directory: app
        run: node --test pruebas/seo-nombres-mejoras.test.js
      - name: Probar recuperación SEO ante HTTP 503
        working-directory: app
        run: node --test pruebas/seo-recuperacion.test.js
      - name: Probar oportunidades SEO, consultas y auditoría de páginas
        working-directory: app
        run: node --test pruebas/seo-oportunidades-claras.test.js
      - name: Verificar sistema visual y accesibilidad fase 1
        working-directory: app
        run: node --test pruebas/ui-sistema-fase1.test.js
      - name: Verificar componentes y navegación visual fase 2
        working-directory: app
        run: node --test pruebas/ui-fase2.test.js
      - name: Verificar navegación y diálogos accesibles fase 3
        working-directory: app
        run: node --test pruebas/ui-fase3.test.js
      - name: Probar menú SEO móvil, accesos e historial
        working-directory: app
        run: node --test pruebas/seo-navegacion-movil.test.js
      - name: Comprobar SEO, selector y salida con Atrás Android
        working-directory: app
        run: node --test pruebas/volver-selector-android.test.js
      - name: Probar PWA con Home real antes de salir en Android
        working-directory: app
        run: node --test pruebas/pwa-home-real.test.js
      - name: Probar descarga completa de BD de proveedores
        working-directory: app
        run: node --test pruebas/proveedores-exportar-bd.test.js
      - name: Probar Google Maps en Dashboard y navegación SEO móvil
        working-directory: app
        run: node --test pruebas/seo-maps-dashboard.test.js
      - name: Verificar sistema visual unificado en todos los módulos
        working-directory: app
        run: node --test pruebas/homologacion-ui-global.test.js
      - name: Compilar aplicación React / Vite
        working-directory: app
        run: npm run build
      - name: Verificar isotipo Android y pantalla de apertura
        working-directory: app
        run: node --test pruebas/pwa-icono-splash.test.js

  validar-navegador:
    name: UX móvil en navegador real (sin autenticación)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Instalar dependencias
        working-directory: app
        run: npm install
      - name: Preparar Playwright Chromium
        working-directory: app
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Iniciar servidor de pruebas
        working-directory: app
        run: |
          npm run dev -- --host 127.0.0.1 > vite-ui.log 2>&1 &
          echo $! > vite-ui.pid
      - name: Validar resoluciones, formularios y protección de rutas
        working-directory: app
        run: node pruebas/ui-browser-smoke.mjs
      - name: Reproducir Atrás Android desde SEO con sesión local simulada
        working-directory: app
        run: node pruebas/ui-pwa-atras-autenticado.mjs
      - name: Validar pantalla de apertura real en Chromium móvil
        working-directory: app
        run: node pruebas/ui-splash-pwa.mjs
      - name: Verificar Google Maps y sus métricas en Android simulado
        working-directory: app
        run: node pruebas/ui-seo-google-maps.mjs
      - name: Revisar pantallas homologadas en navegador móvil y escritorio
        working-directory: app
        run: node pruebas/ui-homologacion-modulos.mjs
      - name: Auditar formularios, fichas e informes internos en cuatro resoluciones
        working-directory: app
        run: node pruebas/ui-auditoria-internas.mjs
      - name: Adjuntar capturas de QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-ui-sin-sesion
          path: |
            app/artifacts/ui/
            app/vite-ui.log
          retention-days: 7

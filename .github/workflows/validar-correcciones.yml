name: Validar correcciones CoproActiva
on:
  pull_request:
    branches:
      - claude/figma-coproactiva-interface-9y82xq
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Instalar dependencias
        working-directory: app
        run: npm install
      - name: Probar criterios y compatibilidad histórica
        working-directory: app
        run: node --test pruebas/criterios.test.js
      - name: Probar reglas de SEO y propuestas editoriales
        working-directory: app
        run: node --test pruebas/seo.test.js
      - name: Probar historial SEO y clasificación sin duplicados
        working-directory: app
        run: node --test src/lib/seoEstadoOportunidades.test.mjs
      - name: Probar historial de navegación Android y PWA
        working-directory: app
        run: node --test src/lib/pestanasHistorial.test.mjs
      - name: Verificar homologación visual de módulos y PWA
        working-directory: app
        run: node --test pruebas/visual.test.js
      - name: Revisar presentación ejecutiva de SEO
        working-directory: app
        run: node --test pruebas/seo-compacto.test.js
      - name: Verificar nombres de mejoras SEO
        working-directory: app
        run: node --test pruebas/seo-nombres-mejoras.test.js
      - name: Probar recuperación SEO ante HTTP 503
        working-directory: app
        run: node --test pruebas/seo-recuperacion.test.js
      - name: Compilar aplicación React / Vite
        working-directory: app
        run: npm run build

/* Cargador del documento: aparece antes de descargar React y sus estilos.
   Se elimina al resolver la sesión, sin tiempo mínimo artificial. */
.splash-inicial {
  position:fixed;
  inset:0;
  z-index:9999;
  display:grid;
  place-items:center;
  padding:24px;
  box-sizing:border-box;
  overflow:hidden;
  background:#fffaf6;
  isolation:isolate;
  opacity:1;
  transition:opacity .22s ease,visibility .22s ease;
}
.splash-inicial::before,
.splash-inicial::after {
  content:"";
  position:absolute;
  z-index:-1;
  width:min(75vw,430px);
  aspect-ratio:1;
  border-radius:50%;
  border:85px solid rgba(213,134,59,.055);
  pointer-events:none;
}
.splash-inicial::before { top:-300px;left:-270px; }
.splash-inicial::after { bottom:-335px;right:-260px; }
.splash-centro {
  width:min(78vw,340px);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:clamp(38px,8vh,64px);
  transform:translateY(-8px);
}
.splash-logo { display:block;width:min(75vw,310px);height:auto; }
.splash-barra {
  width:min(46vw,168px);
  height:4px;
  border-radius:999px;
  background:#eadbd0;
  overflow:hidden;
}
.splash-barra > span {
  display:block;
  width:39%;
  height:100%;
  background:#d5863b;
  border-radius:999px;
  animation:copro-cargando 1.35s ease-in-out infinite alternate;
}
@keyframes copro-cargando {
  0% { transform:translateX(-90%); }
  100% { transform:translateX(265%); }
}
.splash-inicial.splash-finalizando {
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}
@media (prefers-reduced-motion: reduce) {
  .splash-inicial { transition:none; }
  .splash-barra > span { animation:none;transform:translateX(0); }
}
